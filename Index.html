<!DOCTYPE html>
<html><head><base target="_top"><meta charset="UTF-8"></head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">S</div><div><strong>STOCKFLOW</strong><small>INVENTORY CONTROL</small></div></div>
    <nav id="navigation">
      <button class="nav-item active" data-page="dashboard"><span>▦</span>Dashboard</button>
      <button class="nav-item" data-page="current"><span>▤</span>Current Stock</button>
      <button class="nav-item" data-page="products"><span>▣</span>Product Management</button>
      <div class="nav-label">STOCK OPERATIONS</div>
      <button class="nav-item" data-page="in"><span>＋</span>Stock In</button>
      <button class="nav-item" data-page="out"><span>↗</span>Outbound</button>
      <button class="nav-item" data-page="return"><span>↩</span>Return Product</button>
      <button class="nav-item" data-page="damage"><span>⌁</span>Damage Product</button>
      <button class="nav-item" data-page="others"><span>⋯</span>Others</button>
      <div class="nav-label">REPORTS</div>
      <button class="nav-item" data-page="summary"><span>▥</span>Stock Summary</button>
      <button class="nav-item" data-page="history"><span>◷</span>Transaction History</button>
    </nav>
    <div class="sidebar-bottom"><button class="nav-item" id="installBtn"><span>⇩</span>Install / Add to Phone</button><button class="nav-item" id="reconcileBtn"><span>⟳</span>Reconcile Stock</button><div class="sidebar-foot">STOCKFLOW <span>v1.0</span></div></div>
  </aside>
  <main class="main-area">
    <header class="topbar"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div><div class="eyebrow">INVENTORY MANAGEMENT</div><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><button class="btn primary top-add-product" id="globalAddProduct" type="button">＋ Add Product</button><span class="live-dot"></span><span class="live-label">Connected</span><button class="icon-btn" id="refreshBtn" title="Refresh">⟳</button></div></header>
    <section id="pageContent" class="page-content"><div class="loading"><span class="spinner"></span>Loading workspace...</div></section>
    <footer class="app-footer">StockFlow Inventory <span>•</span> Data stored securely in your Google Sheet</footer>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
<div id="modalRoot"></div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#17191D;--panel:#202329;--panel2:#252930;--black:#101114;--gold:#C5A15B;--gold2:#d7b875;--muted:#9298A3;--white:#F4F4F4;--line:#343941;--green:#7dbb99;--red:#d98282;--radius:13px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,Manrope,Arial,sans-serif;font-size:14px}.app-shell{min-height:100vh;display:flex}.sidebar{width:252px;background:var(--black);border-right:1px solid #292c32;display:flex;flex-direction:column;padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:30;transition:transform .25s}.brand{display:flex;align-items:center;gap:11px;padding:3px 10px 28px}.brand-mark{height:37px;width:37px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:800 20px Manrope;border-radius:10px}.brand strong{display:block;letter-spacing:1.5px;font-size:13px}.brand small{color:var(--muted);font-size:9px;letter-spacing:1.6px}.sidebar nav{display:flex;flex-direction:column;gap:4px}.nav-item{width:100%;border:0;background:transparent;color:#b9bec7;text-align:left;padding:11px 12px;border-radius:8px;display:flex;align-items:center;gap:12px;font:500 13px Inter;cursor:pointer;transition:background .15s,color .15s}.nav-item span{width:18px;text-align:center;color:var(--muted);font-size:17px}.nav-item:hover,.nav-item.active{background:#292a2c;color:var(--gold)}.nav-item.active{box-shadow:inset 2px 0 var(--gold)}.nav-item.active span{color:var(--gold)}.nav-label{color:#666d78;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:20px 12px 7px}.sidebar-bottom{margin-top:auto}.sidebar-foot{padding:18px 12px 0;color:#606773;font-size:10px;letter-spacing:1px}.sidebar-foot span{float:right}.main-area{margin-left:252px;width:calc(100% - 252px);min-height:100vh;display:flex;flex-direction:column}.topbar{height:90px;padding:0 34px;border-bottom:1px solid #2b2e34;display:flex;align-items:center;gap:16px;position:sticky;top:0;background:rgba(23,25,29,.96);z-index:10}.eyebrow{font-size:9px;color:var(--muted);letter-spacing:1.6px;margin-bottom:5px}.topbar h1{font:700 21px Manrope;margin:0}.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px}.top-add-product{white-space:nowrap;padding:9px 12px}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.icon-btn{background:var(--panel);border:1px solid var(--line);color:var(--white);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:17px}.mobile-menu{display:none}.page-content{padding:28px 34px 36px;flex:1;max-width:1600px;width:100%;margin:0 auto}.app-footer{padding:15px 34px;color:#666d78;font-size:10px;border-top:1px solid #2b2e34}.app-footer span{color:var(--gold);padding:0 5px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}.page-head h2{font:700 17px Manrope;margin:0 0 5px}.subtext{color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:22px}.stat-card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.stat-card{padding:17px 18px;min-height:104px}.stat-label{color:var(--muted);font-size:11px}.stat-value{font:800 25px Manrope;margin-top:12px}.stat-foot{color:#737b87;font-size:10px;margin-top:3px}.gold{color:var(--gold)}.dashboard-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.panel{padding:18px;margin-bottom:15px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel-head h3{font:700 13px Manrope;margin:0}.panel-head small{color:var(--muted);font-size:10px}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick-action{background:#292d34;border:1px solid #3a4049;border-radius:9px;padding:15px 10px;text-align:left;color:var(--white);cursor:pointer}.quick-action:hover{border-color:var(--gold)}.quick-action b{display:block;color:var(--gold);font-size:17px;margin-bottom:8px}.quick-action span{font-size:11px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#c5cad2;font-weight:600}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;background:#171a1f;border:1px solid #3a4049;color:var(--white);border-radius:8px;padding:11px 12px;font:13px Inter;outline:none;min-height:41px}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus,.toolbar select:focus{border-color:var(--gold)}.field input::placeholder,.toolbar input::placeholder{color:#68707c}.form-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:19px}.btn{border:1px solid var(--line);background:#2a2e35;color:var(--white);border-radius:8px;padding:10px 15px;font:600 12px Inter;cursor:pointer}.btn.primary{background:var(--gold);border-color:var(--gold);color:#17191d}.btn.primary:hover{background:var(--gold2)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.55;cursor:not-allowed}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:250px}.toolbar select{max-width:190px}.table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;min-width:650px;font-size:11px}th{background:#292d34;color:#c4cad2;text-align:left;font-weight:600;white-space:nowrap}th,td{padding:12px 13px;border-bottom:1px solid #343941}td{color:#d7dbe1}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#262a30}.muted{color:var(--muted)}.pill{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:9px;background:#343941;color:#c5cad2}.pill.good{color:var(--green);background:#24372f}.pill.warn{color:var(--gold);background:#3b3426}.pill.bad{color:var(--red);background:#3b292c}.empty{text-align:center;padding:35px 15px;color:var(--muted);font-size:12px}.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:50px;justify-content:center}.spinner{width:17px;height:17px;border:2px solid #505761;border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;bottom:24px;right:24px;z-index:100;background:#2b3037;border:1px solid #4a515b;color:var(--white);padding:12px 16px;border-radius:9px;box-shadow:0 8px 30px #0005;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;max-width:min(420px,calc(100vw - 32px));font-size:12px}.toast.show{opacity:1;transform:translateY(0)}.toast.error{border-color:#9b5555}.modal-backdrop{position:fixed;inset:0;background:#0009;z-index:80;display:grid;place-items:center;padding:16px}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.modal h3{margin:0 0 17px;font:700 16px Manrope}.modal-close{float:right;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}.summary-total{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.summary-chip{background:#292d34;border:1px solid var(--line);padding:10px 12px;border-radius:8px;min-width:120px}.summary-chip small{display:block;color:var(--muted);font-size:10px}.summary-chip b{display:block;margin-top:5px;font:700 16px Manrope}.balance-box{background:#292d34;border:1px solid #414751;padding:10px 12px;border-radius:8px;color:var(--gold);font-size:11px}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-top:13px;color:var(--muted);font-size:11px}.text-right{text-align:right}.nowrap{white-space:nowrap}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.page-content{padding:24px}.topbar{padding:0 24px}}
@media(max-width:760px){.top-add-product{padding:8px 9px;font-size:10px}.sidebar{transform:translateX(-100%);width:275px;box-shadow:12px 0 35px #0006}.sidebar.open{transform:translateX(0)}.main-area{margin-left:0;width:100%}.topbar{height:72px;padding:0 15px}.mobile-menu{display:block}.topbar h1{font-size:17px}.live-label{display:none}.page-content{padding:18px 14px 25px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat-card{padding:13px;min-height:90px}.stat-value{font-size:21px}.dashboard-grid{grid-template-columns:1fr;gap:0}.quick-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr;gap:12px}.field.full{grid-column:auto}.page-head{align-items:flex-start;flex-direction:column}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar input,.toolbar select{max-width:none;width:100%}.toolbar .btn{width:100%}.app-footer{padding:13px 15px}.top-actions{gap:7px}.panel{padding:14px}.form-actions .btn{flex:1}.summary-chip{flex:1;min-width:calc(50% - 9px)}}
@media(max-width:380px){.cards{grid-template-columns:1fr 1fr}.stat-value{font-size:19px}.quick-grid{grid-template-columns:1fr 1fr}.topbar h1{font-size:15px}}
</style>

<script>
const state={page:'dashboard',products:[],current:[],history:[],page:1,historyFilters:{},summaryDate:new Date().toISOString().slice(0,10),dashboard:null,loading:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
function callServer(name,...args){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(r=>{if(r&&r.success)resolve(r.data);else reject(new Error(r?.message||'Request failed'));}).withFailureHandler(e=>reject(new Error(e?.message||String(e))));runner[name](...args);});}
function toast(msg,error=false){const t=$('toast');t.textContent=msg;t.className='toast show'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.className='toast',3600);}
function loading(){ $('pageContent').innerHTML='<div class="loading"><span class="spinner"></span>Loading data...</div>'; }
function nav(page){state.page=page;document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('sidebar').classList.remove('open');renderPage();}
function init(){document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));$('menuBtn').addEventListener('click',()=>$('sidebar').classList.toggle('open'));$('refreshBtn').addEventListener('click',renderPage);$('globalAddProduct').addEventListener('click',async()=>{try{await refreshProducts();productModal();}catch(e){toast(e.message,true);}});$('reconcileBtn').addEventListener('click',reconcile);$('installBtn').addEventListener('click',installHelp);loadInitial();}
async function loadInitial(){try{const d=await callServer('getInitialData');state.products=d.products;state.dashboard=d.dashboard;renderPage();}catch(e){$('pageContent').innerHTML='<div class="panel"><h3>Connection error</h3><p class="subtext">'+esc(e.message)+'</p><button class="btn primary" onclick="loadInitial()">Retry</button></div>';}}
async function renderPage(){const titles={dashboard:'Dashboard',current:'Current Stock',products:'Product Management',in:'Stock In',out:'Outbound',return:'Return Product',damage:'Damage Product',others:'Others',summary:'Stock Summary',history:'Transaction History'};$('pageTitle').textContent=titles[state.page]||'Dashboard';loading();try{switch(state.page){case'dashboard':await renderDashboard();break;case'current':await renderCurrent();break;case'products':await renderProducts();break;case'in':case'out':case'return':case'damage':case'others':renderTransactionForm(state.page);break;case'summary':renderSummary();break;case'history':await renderHistory();break;}}catch(e){$('pageContent').innerHTML='<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>';}}
function stat(label,value,foot=''){return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${fmt(value)}</div><div class="stat-foot">${foot}</div></div>`;}
async function renderDashboard(){const d=await callServer('getDashboard',state.summaryDate);state.dashboard=d.dashboard;const s=d.dashboard;$('pageContent').innerHTML=`<div class="page-head"><div><h2>Overview</h2><div class="subtext">Your inventory at a glance</div></div><button class="btn" onclick="nav('summary')">View stock report ↗</button></div>
<div class="cards">${stat('Total Products',s.products,'Active products')}${stat('Current Stock',s.currentStock,'Total units on hand')}${stat("Today's Stock In",s.stockIn,'Units received')}${stat("Today's Outbound",s.outbound,'Units dispatched')}${stat("Today's Return",s.returns,'Units returned')}${stat("Today's Damage",s.damage,'Units damaged')}${stat("Today's Others",s.others,'Other stock deductions')}</div>
<div class="dashboard-grid"><div><div class="panel"><div class="panel-head"><h3>Quick Actions</h3><small>Common stock operations</small></div><div class="quick-grid"><button class="quick-action" onclick="nav('in')"><b>＋</b><span>Stock In</span></button><button class="quick-action" onclick="nav('out')"><b>↗</b><span>Outbound</span></button><button class="quick-action" onclick="nav('return')"><b>↩</b><span>Return Product</span></button><button class="quick-action" onclick="nav('damage')"><b>⌁</b><span>Damage</span></button><button class="quick-action" onclick="nav('others')"><b>⋯</b><span>Others</span></button><button class="quick-action" onclick="nav('products')"><b>▣</b><span>Add Product</span></button></div></div>
<div class="panel"><div class="panel-head"><h3>Recent Transactions</h3><button class="btn" onclick="nav('history')">View all</button></div>${transactionTable(d.recent.items,false)}</div></div>
<div><div class="panel"><div class="panel-head"><h3>Low Stock Products</h3><small>At or below ${LOW_STOCK_THRESHOLD} units</small></div>${d.lowStock.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Stock</th></tr></thead><tbody>${d.lowStock.map(p=>`<tr><td>${esc(p.name)}</td><td><span class="pill warn">${fmt(p.current)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No low stock products</div>'}</div>
<div class="panel"><div class="panel-head"><h3>Date-wise Snapshot</h3></div><div class="field"><label>Select Date</label><input type="date" id="dashDate" value="${state.summaryDate}" onchange="dashboardDate(this.value)"></div><div class="summary-total" style="margin-top:14px">${[['Previous',d.dateSummary.totals.previous],['In',d.dateSummary.totals.stockIn],['Out',d.dateSummary.totals.outbound],['Closing',d.dateSummary.totals.closing]].map(x=>`<div class="summary-chip"><small>${x[0]}</small><b>${fmt(x[1])}</b></div>`).join('')}</div><button class="btn" onclick="nav('summary')">Open full summary</button></div></div></div>`;}
const LOW_STOCK_THRESHOLD=5;
async function dashboardDate(v){state.summaryDate=v;await renderDashboard();}
function transactionTable(items,actions=true){if(!items||!items.length)return '<div class="empty">No transactions found</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Type</th><th>Qty</th><th>ID</th>${actions?'<th>Action</th>':''}</tr></thead><tbody>${items.map(t=>`<tr><td class="nowrap">${esc(t.date)}</td><td>${esc(t.productName)}</td><td><span class="pill">${esc(t.type)}</span></td><td>${fmt(t.quantity)}</td><td class="muted">${esc(t.id)}</td>${actions?`<td><button class="btn" onclick="editTransaction('${esc(t.id)}')">Edit</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;}
async function refreshProducts(){state.products=await callServer('getInitialData').then(x=>x.products);}
async function renderCurrent(){const rows=await callServer('getCurrentStock');state.current=rows;$('pageContent').innerHTML=`<div class="page-head"><div><h2>Current Inventory</h2><div class="subtext">Live balances calculated from Stock Ledger</div></div><button class="btn" onclick="nav('products')">Manage products</button></div><div class="toolbar"><input id="currentSearch" placeholder="Search product..." oninput="filterCurrent()"><select id="categoryFilter" onchange="filterCurrent()"><option value="">All categories</option>${[...new Set(rows.map(x=>x.category).filter(Boolean))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="currentSort" onchange="filterCurrent()"><option value="name">Sort: Product name</option><option value="stockAsc">Stock: Low to high</option><option value="stockDesc">Stock: High to low</option></select></div><div id="currentTable"></div>`;filterCurrent();}
function filterCurrent(){const q=($('currentSearch')?.value||'').toLowerCase(),cat=$('categoryFilter')?.value||'',sort=$('currentSort')?.value||'name';let a=state.current.filter(p=>p.name.toLowerCase().includes(q)&&(!cat||p.category===cat));a.sort((x,y)=>sort==='stockAsc'?x.current-y.current:sort==='stockDesc'?y.current-x.current:x.name.localeCompare(y.name));$('currentTable').innerHTML=a.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Opening</th><th>Stock In</th><th>Outbound</th><th>Return</th><th>Damage</th><th>Others</th><th>Current</th><th>Details</th></tr></thead><tbody>${a.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.category||'—')}</td><td>${fmt(p.opening)}</td><td>${fmt(p.in)}</td><td>${fmt(p.out)}</td><td>${fmt(p.ret)}</td><td>${fmt(p.damage)}</td><td>${fmt(p.others)}</td><td><span class="pill ${p.current<=LOW_STOCK_THRESHOLD?'warn':'good'}">${fmt(p.current)}</span></td><td><button class="btn" onclick="showProduct('${esc(p.id)}')">View</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="panel empty">No matching products</div>';}
async function renderProducts(){await refreshProducts();const a=state.products;$('pageContent').innerHTML=`<div class="page-head"><div><h2>Product Catalogue</h2><div class="subtext">Create, update and manage your products</div></div><button class="btn primary" onclick="productModal()">＋ Add Product</button></div><div class="toolbar"><input id="productSearch" placeholder="Search product or category..." oninput="filterProducts()"><select id="productStatus" onchange="filterProducts()"><option value="Active">Active products</option><option value="Inactive">Inactive products</option><option value="all">All products</option></select></div><div id="productsTable"></div>`;filterProducts();}
function filterProducts(){const q=($('productSearch')?.value||'').toLowerCase(),st=$('productStatus')?.value||'Active';const a=state.products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(q)&&(st==='all'||p.status===st));$('productsTable').innerHTML=a.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Opening</th><th>Current Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody>${a.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.id)}</div></td><td>${esc(p.category||'—')}</td><td>${fmt(p.opening)}</td><td>${fmt(p.current)}</td><td><span class="pill ${p.status==='Active'?'good':'warn'}">${p.status}</span></td><td class="nowrap"><button class="btn" onclick="productModal('${esc(p.id)}')">Edit</button> <button class="btn" onclick="toggleProduct('${esc(p.id)}','${p.status==='Active'?'Inactive':'Active'}')">${p.status==='Active'?'Deactivate':'Activate'}</button> <button class="btn" onclick="showProduct('${esc(p.id)}')">Details</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="panel empty">No products found</div>';}
function productModal(id){const p=state.products.find(x=>x.id===id);showModal(`${p?'Edit':'Add'} Product`,`<form id="productForm"><div class="form-grid"><div class="field full"><label>Product Name *</label><input name="name" required value="${esc(p?.name||'')}" placeholder="Enter product name"></div><div class="field"><label>Category</label><input name="category" value="${esc(p?.category||'')}" placeholder="Optional"></div>${p?'':'<div class="field"><label>Opening Stock</label><input name="opening" type="number" min="0" step="any" value="0"></div>'}</div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save Product</button></div></form>`);$('productForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const f=new FormData(e.target),data=Object.fromEntries(f.entries());if(p){data.id=p.id;await callServer('editProduct',data);}else await callServer('addProduct',data);closeModal();toast('Product saved');await renderProducts();}catch(err){toast(err.message,true);b.disabled=false;}};}
async function toggleProduct(id,status){if(!confirm(`Product ${status==='Inactive'?'deactivate':'activate'} করবেন?`))return;try{await callServer('setProductStatus',id,status);toast('Status updated');await renderProducts();}catch(e){toast(e.message,true);}}
async function showProduct(id){try{const d=await callServer('getProductDetails',id),p=d.product;showModal('Product Details',`<div class="summary-total"><div class="summary-chip"><small>Opening Stock</small><b>${fmt(p.opening)}</b></div><div class="summary-chip"><small>Current Stock</small><b>${fmt(p.current)}</b></div><div class="summary-chip"><small>Status</small><b>${esc(p.status)}</b></div></div><p class="subtext">${esc(p.name)} · ${esc(p.category||'Uncategorized')} · ${esc(p.id)}</p><h4>Complete Stock History</h4>${d.history.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Qty</th><th>Balance</th><th>Note</th></tr></thead><tbody>${d.history.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${fmt(x.quantity)}</td><td>${fmt(x.balance)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No transaction history</div>'}`);}catch(e){toast(e.message,true);}}
const typeInfo={in:{type:'Stock In',title:'Receive Stock',desc:'Record new inventory received',submit:'Save Stock In'},out:{type:'Outbound',title:'Dispatch Stock',desc:'Record stock leaving your inventory',submit:'Save Outbound'},return:{type:'Return',title:'Record Return',desc:'Add returned products back to stock',submit:'Save Return'},damage:{type:'Damage',title:'Record Damaged Stock',desc:'Remove damaged or unusable inventory',submit:'Save Damage'},others:{type:'Others',title:'Other Stock Deduction',desc:'Record any other stock reduction',submit:'Save Entry'}};
function renderTransactionForm(page){const x=typeInfo[page],active=state.products.filter(p=>p.status==='Active');$('pageContent').innerHTML=`<div class="page-head"><div><h2>${x.title}</h2><div class="subtext">${x.desc}. Backdated entries are supported.</div></div><span class="pill">Transaction Date based</span></div><div class="panel"><form id="transactionForm"><div class="form-grid"><div class="field"><label>Transaction Date *</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Select Product *</label><select name="productId" id="txProduct" required><option value="">Choose a product</option>${active.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${fmt(p.current)} in stock</option>`).join('')}</select></div><div class="field"><label>Quantity *</label><input name="quantity" type="number" min="0.01" step="any" required placeholder="Enter quantity"></div><div class="field" id="availableField"><label>Historical Available Stock</label><div class="balance-box" id="availableStock">Select product and date to check balance</div></div>${page==='damage'||page==='others'?'<div class="field"><label>Reason</label><input name="reason" placeholder="Reason for stock reduction"></div>':''}<div class="field full"><label>Note</label><textarea name="note" placeholder="Optional details"></textarea></div></div><div class="form-actions"><button type="reset" class="btn">Reset</button><button type="submit" class="btn primary">${x.submit}</button></div></form></div>`;
const form=$('transactionForm'),prod=$('txProduct'),date=form.elements.date;async function check(){if(!prod.value){$('availableStock').textContent='Select product and date to check balance';return;}try{const r=await callServer('getHistoricalAvailable',prod.value,date.value);$('availableStock').textContent='Available on '+date.value+': '+fmt(r.available)+' units';}catch(e){$('availableStock').textContent=e.message;}}prod.addEventListener('change',check);date.addEventListener('change',check);form.onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.innerHTML='<span class="spinner"></span> Saving';try{const f=new FormData(form),d=Object.fromEntries(f.entries());d.type=x.type;const r=await callServer('submitTransaction',d);toast(r.message+' ID: '+r.id);form.reset();date.value=new Date().toISOString().slice(0,10);$('availableStock').textContent='Select product and date to check balance';await refreshProducts();}catch(err){toast(err.message,true);}finally{b.disabled=false;b.textContent=x.submit;}};}
function renderSummary(){const date=state.summaryDate||new Date().toISOString().slice(0,10);$('pageContent').innerHTML=`<div class="page-head"><div><h2>Daily Stock Summary</h2><div class="subtext">Historical closing balance for every product</div></div><div class="field"><label>Report Date</label><input type="date" id="summaryDate" value="${date}" onchange="changeSummary(this.value)"></div></div><div id="summaryContent"><div class="loading"><span class="spinner"></span>Calculating summary...</div></div>`;loadSummary(date);}
async function changeSummary(v){state.summaryDate=v;await loadSummary(v);}
async function loadSummary(v){try{const d=await callServer('getStockSummary',v),t=d.totals;$('summaryContent').innerHTML=`<div class="summary-total">${[['Previous Stock',t.previous],['Stock In',t.stockIn],['Outbound',t.outbound],['Return',t.returns],['Damage',t.damage],['Others',t.others],['Closing Stock',t.closing]].map(x=>`<div class="summary-chip"><small>${x[0]}</small><b>${fmt(x[1])}</b></div>`).join('')}</div><div class="panel"><div class="panel-head"><h3>Product-wise Closing Summary</h3><small>${esc(d.date)}</small></div>${d.items.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Previous</th><th>Stock In</th><th>Outbound</th><th>Return</th><th>Damage</th><th>Others</th><th>Closing</th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${esc(x.productName)}</td><td>${fmt(x.previous)}</td><td>${fmt(x.stockIn)}</td><td>${fmt(x.outbound)}</td><td>${fmt(x.returns)}</td><td>${fmt(x.damage)}</td><td>${fmt(x.others)}</td><td><b>${fmt(x.closing)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No products found</div>'}</div>`;}catch(e){$('summaryContent').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
async function renderHistory(){const f=state.historyFilters;const d=await callServer('getTransactions',{...f,page:state.page,pageSize:25});$('pageContent').innerHTML=`<div class="page-head"><div><h2>Transaction History</h2><div class="subtext">Search, filter, edit or remove stock movements</div></div></div><div class="toolbar"><input id="hSearch" placeholder="Search Transaction ID" value="${esc(f.search||'')}"><input id="hFrom" type="date" title="From date" value="${esc(f.from||'')}"><input id="hTo" type="date" title="To date" value="${esc(f.to||'')}"><select id="hProduct"><option value="">All products</option>${state.products.map(p=>`<option value="${esc(p.id)}" ${f.productId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select id="hType"><option value="">All types</option>${['Stock In','Outbound','Return','Damage','Others','Opening'].map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select><button class="btn primary" onclick="applyHistoryFilters()">Apply</button></div>${transactionTable(d.items,true)}<div class="pagination"><span>${d.total} transactions · Page ${d.page} of ${d.pages}</span><button class="btn" ${d.page<=1?'disabled':''} onclick="historyPage(${d.page-1})">Previous</button><button class="btn" ${d.page>=d.pages?'disabled':''} onclick="historyPage(${d.page+1})">Next</button></div>`;}
function applyHistoryFilters(){state.historyFilters={search:$('hSearch').value,from:$('hFrom').value,to:$('hTo').value,productId:$('hProduct').value,type:$('hType').value};state.page=1;renderHistory();}
function historyPage(p){state.page=p;renderHistory();}
async function editTransaction(id){try{const d=await callServer('getTransactions',{search:id,page:1,pageSize:1}),t=d.items[0];if(!t)throw new Error('Transaction not found');if(t.type==='Opening')throw new Error('Opening Stock edit করা যাবে না।');const active=state.products.filter(p=>p.status==='Active');showModal('Edit Transaction',`<form id="editTxForm"><div class="form-grid"><div class="field"><label>Date</label><input name="date" type="date" required value="${esc(t.date)}"></div><div class="field"><label>Transaction Type</label><select name="type">${['Stock In','Outbound','Return','Damage','Others'].map(x=>`<option ${x===t.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Product</label><select name="productId">${active.map(p=>`<option value="${esc(p.id)}" ${p.id===t.productId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="0.01" step="any" required value="${t.quantity}"></div><div class="field full"><label>Note</label><textarea name="note">${esc(t.note)}</textarea></div></div><p class="subtext">Original Submitted At: ${esc(t.submitted||'')}</p><div class="form-actions"><button type="button" class="btn danger" onclick="deleteTx('${esc(id)}')">Delete</button><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save Changes</button></div></form>`);$('editTxForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const data=Object.fromEntries(new FormData(e.target).entries());data.id=id;await callServer('updateTransaction',data);closeModal();toast('Transaction updated');await renderHistory();}catch(err){toast(err.message,true);b.disabled=false;}};}catch(e){toast(e.message,true);}}
async function deleteTx(id){if(!confirm('এই Transaction স্থায়ীভাবে Delete করবেন? Stock পুনরায় Calculate হবে।'))return;try{await callServer('deleteTransaction',id);closeModal();toast('Transaction deleted');await renderHistory();}catch(e){toast(e.message,true);}}
function showModal(title,body){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="modal-close" onclick="closeModal()">×</button><h3>${esc(title)}</h3>${body}</div></div>`;}
function closeModal(){$('modalRoot').innerHTML='';}
async function reconcile(){if(!confirm('Stock Ledger থেকে সব Product-এর Current Stock পুনরায় Calculate করবেন?'))return;try{const r=await callServer('reconcileStock');toast(r.message);await renderPage();}catch(e){toast(e.message,true);}}
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
async function installHelp(){if(installPrompt){installPrompt.prompt();const choice=await installPrompt.userChoice;toast(choice.outcome==='accepted'?'Install request accepted':'Install cancelled');installPrompt=null;return;}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);showModal('Add StockFlow to your phone',ios?'<ol><li>Safari browser-এ এই Web App খুলুন।</li><li>নিচের Share icon চাপুন।</li><li><b>Add to Home Screen</b> নির্বাচন করুন।</li><li>Add চাপুন।</li></ol><p class="subtext">এটি Home Screen-এ একটি shortcut তৈরি করবে।</p>':'<ol><li>Chrome browser-এ এই Web App খুলুন।</li><li>উপরের ⋮ menu চাপুন।</li><li><b>Add to Home screen</b> অথবা <b>Install app</b> নির্বাচন করুন।</li><li>Add / Install চাপুন।</li></ol><p class="subtext">Install option না থাকলে Add to Home screen ব্যবহার করুন।</p>');}
window.addEventListener('load',init);
</script>

</body></html>
